name: Android CI/CD - Build & Release (APK + AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release with APK and AAB assets'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.7)'
        required: false
        type: string
        default: 'v1.0.7'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (APK + Play Store AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Accepting licenses with $SDKMANAGER..."
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore for Release Signing
        id: setup_keystore
        run: |
          echo "Using permanent repository release keystore..."
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "KEY_ALIAS=one_release_key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=one_keystore_secure" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=one_keystore_secure" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Signed Google Play App Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify APK Signature (v1, v2 & v3 schemes)
        run: |
          mkdir -p build/dist
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Verifying signature on: $RELEASE_APK"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          cp "$RELEASE_APK" build/dist/ONE-release.apk

          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "Copying Play Store AAB: $RELEASE_AAB"
          cp "$RELEASE_AAB" build/dist/ONE-release.aab

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build/dist/ONE-debug.apk
          fi

      - name: Upload Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: ONE-release-apk
          path: build/dist/ONE-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB (Console Upload)
        uses: actions/upload-artifact@v4
        with:
          name: ONE-playstore-aab
          path: build/dist/ONE-release.aab
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-debug-apk
          path: build/dist/ONE-debug.apk
          if-no-files-found: warn

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v1.0.7') }}
          name: "ONE Release ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v1.0.7') }}"
          body: |
            ## 🎉 ONE — All-in-One Offline Utility App

            ### 📱 Compatibility
            - **Android Support**: Android 7.0+ (API 24 through Android 15 & 16+).
            - **Signing**: Signed with official Android APK Signature Scheme v2 + v3 for direct installation without errors.

            ### 📦 Release Assets
            - **Signed Release APK**: `ONE-release.apk` (Direct install on Android devices)
            - **Google Play App Bundle**: `ONE-release.aab` (Upload to Google Play Console)
            - **Debug APK**: `ONE-debug.apk` (Development & testing)

            ### ✨ Features Included
            - 100% On-Device & Offline-First (Zero cloud tracking, zero external databases).
            - Android 13+ Material You Themed Icon Support (Adaptive `<monochrome>` layer).
            - 20 Built-In Tools: Image-to-PDF, Background Removal, Compression, Universal & Everyday Calculators, Document Scanner, Text Tools, Developer Tools, Offline Currency & Time, Storage Analyzer, Batch Renamer, and Chained Workflows.
            - Pastel Bento-Grid UI matching reference specifications.
          files: |
            build/dist/ONE-release.apk
            build/dist/ONE-release.aab
            build/dist/ONE-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
